name: Atualizar API de esportes

on:
  schedule:
    # A cada 10 minutos (o GitHub pode atrasar execuções agendadas em alguns minutos)
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copiar páginas do site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' ./ _site/

      - name: Testar normalização
        run: node --test "scripts/sports-api/*.test.mjs"

      - name: Buscar dados dos jogos
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: node scripts/sports-api/build.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
