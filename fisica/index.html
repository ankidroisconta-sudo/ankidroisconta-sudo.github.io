<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1024">
<title>Física Quest ENEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1024; --bg2:#181a3a; --card:#20234a; --card2:#2a2e5e; --ink:#f4f5ff; --mut:#a9acd6;
  --ok:#2ee59d; --bad:#ff5c7a; --gold:#ffcf3f; --acc:#7c5cff; --acc2:#00d4ff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#3a2a8a55,transparent),radial-gradient(900px 500px at -10% 110%,#00d4ff22,transparent),var(--bg)}
h1,h2,h3,.ttl{font-family:"Baloo 2",Nunito,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:12px 16px 96px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.back{background:var(--card);width:40px;height:40px;border-radius:12px;font-size:20px;flex:none}
.top h2{font-size:22px;flex:1}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:12px;background:#ffffff18;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.hero{background:linear-gradient(135deg,#7c5cff,#00b3ff);border-radius:24px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h1{font-size:28px}
.hero p{margin:6px 0 12px;opacity:.95}
.hero .big{position:absolute;right:-10px;top:-6px;font-size:84px;opacity:.25;transform:rotate(12deg)}
.map{position:relative;display:flex;flex-direction:column;gap:14px}
.node{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;text-align:left;width:100%;position:relative;border:2px solid transparent;transition:transform .15s}
.node:active{transform:scale(.97)}
.node .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none;box-shadow:0 6px 0 #0004}
.node .nm{font-family:"Baloo 2";font-size:19px;font-weight:800}
.node .ds{color:var(--mut);font-size:13px}
.node.locked{opacity:.45;filter:grayscale(.8)}
.node .stars{font-size:15px;letter-spacing:2px;margin-top:2px}
.node.next{border-color:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffcf3f33}}
.nav{position:fixed;left:0;right:0;bottom:0;background:#12142ef2;backdrop-filter:blur(8px);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ffffff14;z-index:20}
.nav div{display:flex;max-width:520px;width:100%;justify-content:space-around}
.nav button{background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:4px 10px;border-radius:12px}
.nav button b{font-size:22px;line-height:1.2}
.nav button.on{color:var(--ink);background:#ffffff10}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--acc);font-weight:800;font-size:17px;box-shadow:0 5px 0 #4b33b8;margin-top:10px;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4b33b8}
.btn.g{background:var(--ok);color:#06281b;box-shadow:0 5px 0 #17a06b}
.btn.y{background:var(--gold);color:#2f2300;box-shadow:0 5px 0 #b8901a}
.btn.ghost{background:var(--card);box-shadow:0 5px 0 #0006}
.btn[disabled]{opacity:.4}
.step{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:var(--r);margin-bottom:10px;width:100%;text-align:left}
.step .n{font-size:26px;width:44px;text-align:center}
.step .t{flex:1}
.step .t b{display:block;font-family:"Baloo 2";font-size:18px}
.step .t span{color:var(--mut);font-size:13px}
.lcard{background:var(--card);border-radius:24px;padding:22px 18px;min-height:52vh;animation:in .35s;position:relative}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.lcard .em{font-size:52px;line-height:1}
.lcard h3{font-size:24px;margin:10px 0 8px}
.lcard p,.lcard li{line-height:1.6;font-size:17px}
.lcard ul{padding-left:20px;margin:8px 0}
.f{display:inline-block;background:#0007;border:1px solid #ffffff22;border-radius:10px;padding:2px 10px;font-weight:800;font-family:"Baloo 2";font-size:18px;color:var(--gold)}
.tip{background:linear-gradient(135deg,#ffcf3f22,#ff8a3d22);border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;margin:10px 0}
.warn{background:#ff5c7a1f;border-left:4px solid var(--bad);padding:10px 12px;border-radius:10px;margin:10px 0}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:#ffffff30}
.dots i.on{background:var(--acc2);width:22px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.qtxt{font-size:19px;font-weight:700;line-height:1.4;margin:6px 0 16px;background:var(--card);padding:18px;border-radius:var(--r)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card2);margin-bottom:10px;font-size:16px;font-weight:600;border:2px solid #ffffff10;box-shadow:0 4px 0 #0005;transition:transform .1s}
.opt:active{transform:translateY(2px)}
.opt.ok{background:#14513a;border-color:var(--ok)}
.opt.bad{background:#5a1a2a;border-color:var(--bad);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.exp{background:var(--bg2);border-radius:14px;padding:14px;margin-top:6px;animation:in .3s;line-height:1.5}
.exp b.k{color:var(--ok)} .exp b.x{color:var(--bad)}
.combo{font-family:"Baloo 2";font-weight:800;color:var(--gold)}
.float{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-family:"Baloo 2";font-size:34px;font-weight:800;color:var(--gold);pointer-events:none;animation:fl 1s forwards;z-index:50;text-shadow:0 3px 0 #0008}
@keyframes fl{to{transform:translate(-50%,-90px);opacity:0}}
.timer{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad));transition:width .2s linear}
.gitem{background:var(--card);border-radius:24px;padding:28px 18px;text-align:center;font-size:22px;font-weight:800;margin:14px 0;min-height:130px;display:grid;place-items:center;animation:in .25s}
.gitem small{display:block;font-size:44px}
.cats{display:grid;gap:10px}
.cat{padding:16px;border-radius:16px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #0006}
.cat:active{transform:translateY(3px)}
.ord{display:grid;gap:8px}
.ord button{padding:13px;border-radius:14px;background:var(--card2);font-weight:700;box-shadow:0 4px 0 #0005;text-align:left}
.ord .done{background:#14513a;border:2px solid var(--ok);padding:11px 13px;border-radius:14px;font-weight:700;animation:in .2s}
.result{text-align:center;padding:16px 0}
.result .bigst{font-size:56px;letter-spacing:6px}
.result h2{font-size:30px;margin:6px 0}
.flip{perspective:900px;margin-bottom:12px;cursor:pointer}
.flip .in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:130px}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.flip .fa{background:var(--card)}
.flip .fb{background:linear-gradient(135deg,#7c5cff,#00a6e6);transform:rotateY(180deg)}
.flip small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.flip .fb small{color:#fff9}
.badge{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
.badge .e{font-size:32px}
.badge.off{opacity:.35;filter:grayscale(1)}
.sim{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
input[type=range]{width:100%;accent-color:var(--acc2);height:34px}
.therm{display:flex;gap:16px;align-items:flex-end;justify-content:center;height:220px}
.tube{width:34px;height:200px;border-radius:20px;background:#ffffff14;position:relative;overflow:hidden;border:3px solid #ffffff33}
.tube i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#ff3d6e,#ff9f43);transition:height .2s}
.read{font-family:"Baloo 2";font-size:22px;font-weight:800}
.task{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed #ffffff18}
.task b{font-size:20px}
.shower{font-size:64px;text-align:center;position:relative;height:120px}
.drops{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;gap:6px}
.drops i{width:6px;height:16px;border-radius:6px;animation:drop .6s infinite}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.seg{display:flex;gap:6px;background:#0005;padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:800;background:none;font-size:14px}
.seg button.on{background:var(--acc)}
.muted{color:var(--mut)}
.center{text-align:center}
.hearts{font-size:20px;letter-spacing:2px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.chip{display:inline-block;background:#ffffff14;border-radius:8px;padding:2px 8px;margin:2px;font-size:13px}
.daily{background:var(--card);border-radius:20px;padding:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center}
.daily .e{font-size:36px}
.mascot{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.mascot span{font-size:34px;flex:none;animation:bob 2.4s ease-in-out infinite}
.mascot p{margin:0;background:#fff;color:#1d1f45;padding:10px 14px;border-radius:16px 16px 16px 4px;font-weight:700;line-height:1.35;position:relative}
@keyframes bob{50%{transform:translateY(-5px) rotate(8deg)}}
.gl{display:inline;background:none;color:var(--acc2);font-weight:800;padding:0;border-bottom:2px dashed var(--acc2);font-size:inherit;line-height:inherit}
.glpop{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--card2);border:2px solid var(--acc2);border-radius:20px;padding:16px;z-index:65;animation:in .25s;box-shadow:0 12px 40px #000a}
.glpop b{font-family:"Baloo 2";font-size:20px}.glpop p{line-height:1.5;margin:6px 0 4px}
.say{position:absolute;top:14px;right:14px;background:#ffffff14;border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px}
.hint{display:block;margin:-6px 0 12px auto;background:#ffcf3f22;color:var(--gold);border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--gold);color:#2f2300;font-weight:800;padding:12px 18px;border-radius:14px;z-index:70;animation:in .3s;box-shadow:0 8px 30px #0008;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div>
  <button data-nav="home"><b>🗺️</b>Jornada</button>
  <button data-nav="macetes"><b>🧠</b>Macetes</button>
  <button data-nav="review"><b>🎯</b>Erros</button>
  <button data-nav="profile"><b>🏆</b>Perfil</button>
</div></nav>
<canvas id="cf"></canvas>
<script>
/* ================= CONTEÚDO ================= */
const W = [
{id:'energia',e:'⚡',c:'#ffb703',name:'Energia Mecânica',ds:'Cinética, potencial e a conservação',
cards:[
{e:'🎨',t:'O que é energia?',m:'Oi! Eu sou o Professor Átomo. Bora descobrir a física juntos?',b:`<p>[[Energia]] é o “poder de fazer coisas acontecerem”: mexer, esquentar, acender uma luz, fazer barulho.</p><p>Ela é como <b>massinha de modelar</b>: você pode transformar o bichinho em outro bichinho, mas a massinha <b>não some e não aparece do nada</b>. Energia só <b>muda de forma</b> ou <b>passa de um lugar para outro</b>.</p><div class="tip">Seu corpo percebe 3 tipos que caem MUITO na prova:<br>🔥 <b>calor</b> você sente · 🔊 <b>som</b> você ouve · 💡 <b>luz</b> você vê</div>`},
{e:'⚽',t:'Cinética: a energia de quem se mexe',m:'Tudo que está andando tem essa energia!',b:`<p>Bola chutada, carro andando, você correndo: tudo que tem [[velocidade]] tem <b>energia cinética</b>.</p><p class="center"><span class="f">E<sub>c</sub> = m·v²/2</span></p><p><b>m</b> = [[massa]] (quanto “de coisa” tem, em kg)<br><b>v</b> = velocidade</p><div class="tip">O <b>v está ao quadrado</b>: se a velocidade <b>dobra</b>, a energia fica <b>4 vezes</b> maior! Por isso batida de carro rápido é tão perigosa. 🚗💥</div>`},
{e:'🐷',t:'Gravitacional: o cofrinho da altura',m:'Quanto mais alto, mais moedinhas no cofrinho!',b:`<p>Uma coisa lá no alto tem energia <b>guardada</b>, esperando. É como um <b>cofrinho</b>: quanto mais alto, mais energia guardada.</p><p>Soltou? O cofrinho abre e a energia vira movimento (a coisa cai cada vez mais rápido).</p><p class="center"><span class="f">E<sub>g</sub> = m·g·h</span></p><p><b>g</b> = [[gravidade]] (≈ 10) · <b>h</b> = altura em metros</p>`},
{e:'🏹',t:'Elástica: a energia do esticado',m:'Estica, solta e... fiuuu!',b:`<p>Estilingue esticado, mola apertada, cama elástica afundada: tudo isso guarda <b>energia elástica</b>. Soltou, ela vira movimento!</p><p class="center"><span class="f">E<sub>el</sub> = k·x²/2</span></p><p><b>k</b> = o quanto a mola é durinha · <b>x</b> = o quanto você apertou ou esticou</p><div class="tip">🕵️ Truque do detetive:<br>tem <b>velocidade</b>? → cinética<br>tem <b>altura</b>? → gravitacional<br>tem <b>mola esticada/apertada</b>? → elástica</div>`},
{q:'Um atleta parado no alto da plataforma de salto, antes de pular, tem principalmente qual energia?',o:['Cinética','Gravitacional','Elástica'],a:1,x:'Ele está no alto e parado: altura sem velocidade = cofrinho gravitacional! 🐷'},
{e:'🛝',t:'A energia que não se perde',m:'No escorregador perfeito, nada se perde!',b:`<p>Imagine um escorregador <b>superliso</b>, sem nenhum [[atrito]]. Lá em cima, a energia toda está no <b>cofrinho</b> (gravitacional). Lá embaixo, ela virou toda <b>velocidade</b> (cinética). O total é sempre o mesmo!</p><p class="center"><span class="f">energia no começo = energia no fim</span></p><p>Caiu de 20 m? m·g·h = m·v²/2 → v² = 2·10·20 = 400 → <b>v = 20 m/s</b>.</p><div class="tip">Palavras mágicas na prova que deixam usar isso: <b>“despreze o atrito”</b>, <b>“perfeitamente liso”</b>, <b>“queda livre”</b>.</div>`},
{e:'🎢',t:'Tobogã cheio de curvas',m:'Só a altura importa. O caminho, não!',b:`<p>O tobogã pode ser reto, torto, cheio de ondinhas... Se não tem atrito, a velocidade lá embaixo depende <b>só da altura</b> de onde você saiu.</p><p>20 m de altura → 20 m/s. Sempre!</p><div class="warn">As fórmulas de movimento (cinemática) só funcionam em linha reta ou círculo. Viu um caminho curvo pedindo velocidade? Use <b>energia</b>!</div>`},
{e:'💪',t:'Trabalho: dar energia empurrando',m:'Empurrou e a coisa andou? Você fez trabalho!',b:`<p>Quando você empurra um carrinho e ele anda, você passou energia para ele. Na física isso se chama <b>trabalho</b>: é a “mãe” de todas as energias de movimento.</p><p class="center"><span class="f">τ = F·d·cosθ</span></p><ul><li>Força <b>de lado</b> (90°) não faz trabalho: segurar a mochila andando reto não dá energia para ela.</li><li>Trabalho de todas as forças juntas = quanto a energia de movimento mudou (<span class="f">τ = ΔE<sub>c</sub></span>).</li></ul>`},
{e:'🧸',t:'A mola esperta (pergunta sem conta)',m:'Dá para acertar sem fazer conta. Olha só!',b:`<p>Um brinquedo lança um cubinho com uma mola. Juntando as fórmulas: <span class="f">v = x·√(k/m)</span></p><ul><li>Quer o cubo <b>4 vezes</b> mais rápido mexendo no aperto? Aperte <b>4 vezes</b> mais.</li><li>Quer mexendo só na mola? Precisa de uma mola <b>16 vezes</b> mais dura, porque o k está dentro da raiz (√16 = 4).</li></ul>`},
{q:'Para dobrar a velocidade de lançamento trocando apenas a mola (mesma deformação), a nova constante k deve ser:',o:['2× maior','4× maior','8× maior','Igual'],a:1,x:'O k está dentro da raiz. Para a velocidade dobrar, √k dobra → k fica 4 vezes maior.'},
{e:'📌',t:'Cola da geladeira',m:'Lê em voz alta 3 vezes. Seu cérebro agradece!',b:`<ul><li>⚽ Mexendo → <b>cinética</b> (m·v²/2)</li><li>🐷 No alto → <b>gravitacional</b> (m·g·h)</li><li>🏹 Mola esticada → <b>elástica</b> (k·x²/2)</li><li>🛝 Sem atrito → energia do começo = energia do fim</li><li>🎢 Caminho curvo pedindo velocidade → use energia</li></ul>`}
],
quiz:[
{q:'No salto com vara (1: corre; 2: transição; 3: altura máxima; 4: cai no colchão), para atingir a maior altura é preciso que:',o:['A energia cinética da etapa 1 vire potencial elástica na etapa 4','A energia cinética da etapa 1 vire potencial gravitacional na etapa 3','A energia gravitacional da etapa 2 vire cinética na etapa 1','A energia gravitacional da etapa 1 vire elástica na etapa 4'],a:1,x:'Etapa 1 tem velocidade (cinética). Etapa 3 tem altura (gravitacional). Quanto mais rápido ele corre, mais alto ele sobe. (ENEM)'},
{q:'Um corpo é abandonado em queda livre de 20 m (g = 10 m/s²). Com que velocidade chega ao chão?',o:['10 m/s','14 m/s','20 m/s','40 m/s'],a:2,x:'mgh = mv²/2 → v² = 2·10·20 = 400 → v = 20 m/s.'},
{q:'Uma bolinha desce um tobogã sem atrito e todo curvo, de 45 m de altura, partindo do repouso. A velocidade no pé do tobogã é:',o:['Impossível calcular: a trajetória é curva','15 m/s','30 m/s','45 m/s'],a:2,x:'Só a altura importa: v² = 2gh = 900 → v = 30 m/s. Cinemática não resolve, energia resolve.'},
{q:'Para que o cubo de um lançador de mola (sem atrito) saia com 4× a velocidade, o projetista pode:',o:['Manter a mola e dobrar a deformação','Manter a mola e quadruplicar a deformação','Manter a mola e aumentar 16× a deformação','Trocar por mola de k 4× maior'],a:1,x:'v = x·√(k/m). x é diretamente proporcional a v → 4× x. Para mexer em k precisaria de 16×. (ENEM)'},
{q:'Qual destas energias pode assumir valor negativo?',o:['Cinética','Potencial elástica','Potencial gravitacional','Nenhuma'],a:2,x:'Massa e v² são positivos; k e x² também. Só a gravitacional depende do referencial escolhido.'},
{q:'Qual frase do enunciado NÃO te dá o “alvará” para usar a conservação da energia mecânica?',o:['Despreze os atritos','A pista é perfeitamente lisa','Considere a resistência do ar e o atrito com o piso','O corpo está em queda livre'],a:2,x:'Com forças dissipativas (atrito, resistência do ar) parte da energia mecânica vira calor/som.'},
{q:'Você carrega uma mochila andando na horizontal com velocidade constante. O peso da mochila realiza trabalho?',o:['Sim, positivo','Sim, negativo','Não: a força é perpendicular ao deslocamento','Depende da massa'],a:2,x:'τ = F·d·cos 90° = 0.'},
{q:'O trabalho da força resultante sobre um corpo é igual à:',o:['Variação da energia cinética','Energia potencial final','Potência média','Força vezes o tempo'],a:0,x:'Teorema da energia cinética: τ_res = ΔEc. Força resultante → aceleração → muda a velocidade → muda a cinética.'},
{q:'Um carro de 2000 kg a 40 m/s (≈144 km/h) tem energia cinética de:',o:['80.000 J','160.000 J','1.600.000 J','3.200.000 J'],a:2,x:'Ec = 2000·40²/2 = 1000·1600 = 1.600.000 J. No freio, isso vira calor (e som).'}
],

{id:'potencia',e:'💡',c:'#ff6b6b',name:'Potência & Rendimento',ds:'A fórmula nº 1 do ENEM',
cards:[
{e:'🚿',t:'Potência = rapidez',m:'Não é sobre QUANTA energia, é sobre QUÃO RÁPIDO!',b:`<p>Encher um balde com uma <b>mangueira</b> ou com um <b>conta-gotas</b>: no final é a mesma água, mas a mangueira é muito mais rápida.</p><p>[[Potência]] é isso: o quão <b>rápido</b> a energia é usada ou passada adiante.</p><p class="center"><span class="f">P = E/Δt</span></p><p>A unidade é o [[watt]] (W): <b>1 W = 1 [[joule]] por segundo</b>. Lâmpada de 60 W = gasta 60 J a cada segundo.</p>`},
{e:'🕵️',t:'Regra do detetive',m:'Essa é a fórmula número 1 da prova!',b:`<div class="tip">Viu a letra <b>W</b> (watt) na questão? Escreva <b>P = E/Δt</b> no cantinho da folha, mesmo sem saber se vai usar.</div><p>Se a questão fala de <b>potência</b> e de <b>tempo</b> juntos (ou de <b>vazão</b>, que é “água por segundo”), pode ter certeza: é ela!</p>`},
{e:'🏆',t:'O time das 6 estrelas',m:'Essas são as fórmulas que mais aparecem no ENEM.',b:`<ol><li><span class="f">P = E/Δt</span> potência</li><li><span class="f">P = U·i</span> potência elétrica</li><li><span class="f">U = R·i</span> lei de Ohm</li><li><span class="f">d = v·t</span> distância</li><li><span class="f">v = λ·f</span> ondas</li><li><span class="f">Q = m·c·Δθ</span> calor</li></ol><p class="muted">Você vai encontrar todas elas pela jornada. Quando aparecerem, dê um “oi”!</p>`},
{e:'🍬',t:'Rendimento: quanto foi aproveitado',m:'Nenhuma máquina é perfeita!',b:`<p>Você ganhou <b>10 balas</b>, deixou 2 caírem no chão e comeu 8. Você aproveitou 8 de 10 = <b>80%</b>. Isso é [[rendimento]]!</p><p class="center"><span class="f">η = P<sub>útil</sub> / P<sub>total</sub></span></p><p>Um motor puxa 200 W da tomada, mas só 40 W viram movimento: 40 ÷ 200 = <b>20%</b>. O resto vira calor e barulho.</p>`},
{e:'🔎',t:'Os 3 passos para qualquer conta',m:'Siga a receita e não trava!',b:`<div class="tip">1️⃣ Escreva a fórmula do que a questão <b>pede</b>.<br>2️⃣ Troque as letras pelos números que a questão <b>já deu</b>.<br>3️⃣ O que ainda falta? Procure usando os dados que você <b>ainda não usou</b>.</div><p>Sobrou um dado sem usar no final? Desconfie: você deve ter esquecido alguma coisa!</p>`},
{e:'💧',t:'Usina: a água que vira luz',m:'1 litro de água pesa 1 quilo. Guarde isso!',b:`<p>Numa usina, a água cai lá de cima (cofrinho de altura 🐷), gira a turbina e vira eletricidade.</p><p>Como <b>1 litro de água = 1 kg</b>, a [[vazão]] em litros por segundo é a mesma em kg por segundo:</p><p class="center"><span class="f">P = vazão·g·h</span></p><p>3000 L/s caindo de 100 m: 3000·10·100 = <b>3.000.000 W</b> (3 MW). Se a turbina aproveita 80%, sobram <b>2,4 MW</b>.</p>`},
{q:'Uma queda d’água de 10 m tem vazão de 500 L/s (g = 10). A potência total disponível é:',o:['5 kW','50 kW','500 kW','5 MW'],a:1,x:'P = vazão·g·h = 500·10·10 = 50.000 W = 50 kW.'},
{e:'🔍',t:'Intensidade: a lupa que queima',m:'Mesma energia num espacinho menor = mais forte!',b:`<p>Com uma lupa, a luz do Sol fica concentrada num pontinho e queima o papel. A potência é a mesma, mas espremida numa <b>área pequena</b>.</p><p class="center"><span class="f">I = P/A</span> (W/m²)</p><div class="tip">Viu <b>W/m²</b>? Lembre do <b>IPA</b>: I = P/A.<br>Gritar com as mãos em concha 📣 faz o mesmo com o som.</div>`},
{e:'📌',t:'Cola da geladeira',m:'Repita comigo!',b:`<ul><li>⚡ Potência = rapidez: <b>P = E/Δt</b></li><li>🕵️ Viu W → escreve P = E/Δt</li><li>🍬 Rendimento = aproveitado ÷ total</li><li>💧 1 L de água = 1 kg → P = vazão·g·h</li><li>🔍 Viu W/m² → IPA (I = P/A)</li></ul>`}
],
quiz:[
{q:'Um motor de 200 W ergue 80 kg a 3 m de altura em 1 minuto (g = 10). A eficiência é:',o:['10%','20%','40%','80%'],a:1,x:'Pútil = mgh/t = 80·10·3/60 = 40 W. η = 40/200 = 20%. (ENEM PPL)'},
{q:'Uma usina tem vazão de 3000 L/s e queda de 100 m. Com turbina de 80% de rendimento, a potência útil é:',o:['0,8 MW','2,4 MW','3,0 MW','24 MW'],a:1,x:'Ptotal = 3000·10·100 = 3 MW. 80% disso = 2,4 MW.'},
{q:'Carro solar: insolação 1000 W/m², painel de 9 m², rendimento 30%, massa 200 kg. Do repouso até 108 km/h leva cerca de:',o:['1,0 s','4,0 s','33 s','300 s'],a:2,x:'Psolar = 1000·9 = 9000 W; Pmec = 30% = 2700 W. Ec = 200·30²/2 = 90.000 J. t = 90.000/2700 ≈ 33 s. (ENEM)'},
{q:'Apareceu a unidade W/m² no enunciado. Qual grandeza é essa?',o:['Potência','Energia','Intensidade (I = P/A)','Pressão'],a:2,x:'W/m² = potência por área = intensidade. Escreva IPA!'},
{q:'O que significa uma lâmpada de 60 W?',o:['Consome 60 J por hora','Transforma 60 J de energia a cada segundo','Tem 60 V','Gasta 60 kWh por dia'],a:1,x:'1 W = 1 J/s. 60 W = 60 J a cada segundo.'},
{q:'Ao gritar com as mãos em concha você aumenta:',o:['A potência da sua voz','A intensidade do som (menor área)','A frequência do som','A velocidade do som'],a:1,x:'I = P/A. A potência é a mesma, mas a área diminui → intensidade aumenta.'},
{q:'Uma questão fala em potência e dá a vazão de água (L/s), sem citar tempo. Qual fórmula você deve usar?',o:['P = U·i','P = E/Δt (vazão já é algo por tempo)','Q = m·c·Δθ apenas','v = λ·f'],a:1,x:'Vazão = volume/tempo = massa/tempo (para água). Potência + vazão = fórmula nº1.'},
{q:'Uma turbina de rendimento 80% recebe 10 MW. A potência dissipada (perdida) é:',o:['0,8 MW','2 MW','8 MW','10 MW'],a:1,x:'Útil = 8 MW; dissipada = 10 − 8 = 2 MW.'}
],

{id:'termometria',e:'🌡️',c:'#00b3ff',name:'Termometria',ds:'Escalas, conversões e a escala maluca',
cards:[
{e:'🕺',t:'Temperatura é tremedeira',m:'Tudo é feito de bolinhas que tremem sem parar!',b:`<p>Tudo é feito de [[átomos]], pecinhas minúsculas que <b>tremem</b> o tempo todo.</p><p>Pense numa festa: música lenta → todo mundo quase parado 🥶 (frio). Música agitada → todo mundo pulando 🥵 (quente).</p><p>[[Temperatura]] mede <b>o quanto os átomos estão tremendo</b>.</p>`},
{e:'🍦',t:'Calor NÃO é temperatura',m:'Essa pegadinha cai muito!',b:`<p>[[Calor]] é a <b>energia que viaja</b>, sempre sozinha, do mais <b>quente</b> para o mais <b>frio</b>.</p><p>Segurando um picolé, o “frio” não entra na sua mão: é o <b>calor da sua mão que sai</b> e vai para o picolé. Por isso a mão gela e o picolé derrete!</p><div class="tip">Temperatura = tremedeira (kelvin, K) · Calor = energia viajando (joule, J). Coisas diferentes!</div>`},
{e:'📏',t:'As três réguas de temperatura',m:'Cada país usa uma régua diferente.',b:`<p>Termômetro é uma régua para tremedeira. Existem 3 réguas famosas:</p><table style="width:100%;text-align:center"><tr><th></th><th>°C 🇧🇷</th><th>°F 🇺🇸</th><th>K 🔬</th></tr><tr><td>🧊 gelo derretendo</td><td>0</td><td>32</td><td>273</td></tr><tr><td>♨️ água fervendo</td><td>100</td><td>212</td><td>373</td></tr></table><p class="muted">Celsius no Brasil, Fahrenheit nos EUA, [[Kelvin]] com os cientistas.</p>`},
{e:'🧊',t:'Kelvin: o fim da festa',m:'No zero absoluto ninguém mais dança!',b:`<p>Se esfriar, esfriar, esfriar... chega um ponto em que os átomos <b>param de tremer</b>. A festa acabou! Isso é o <b>zero absoluto</b>: −273 °C.</p><p>Kelvin começa ali, no zero de verdade. Por isso <b>não tem número negativo</b> (não existe “tremer menos que parado”).</p><p class="center"><span class="f">T<sub>K</sub> = T<sub>C</sub> + 273</span></p><div class="tip">Os degraus das duas réguas têm o <b>mesmo tamanho</b>: subir 10 °C = subir 10 K.</div>`},
{q:'Uma variação de 12 °C corresponde a qual variação em kelvin?',o:['12 K','285 K','261 K','21,6 K'],a:0,x:'Os degraus têm o mesmo tamanho: subir 12 °C = subir 12 K.'},
{e:'🇺🇸',t:'Viagem para a Disney',m:'Faz a conta comigo, passo a passo!',b:`<p class="center"><span class="f">T<sub>C</sub>/5 = (T<sub>F</sub> − 32)/9</span></p><p>O painel do aeroporto diz <b>41 °F</b>. Está quente?</p><ol><li>41 − 32 = <b>9</b></li><li>9 ÷ 9 = <b>1</b></li><li>1 × 5 = <b>5 °C</b></li></ol><p>5 °C: frio pra danar! Leve casaco. 🧣</p>`},
{e:'🪜',t:'Inventando a sua régua',m:'Dá para converter QUALQUER escala!',b:`<p>Coloque dois termômetros lado a lado: os pedaços ficam <b>proporcionais</b>, como duas escadas de tamanhos diferentes subindo juntas.</p><p>Exemplo: um termômetro teve os números apagados. Você sabe que 20 °C dava 38 mm e 32 °C dava 62 mm.</p><ul><li>Subiu 12 °C → subiu 24 mm → <b>2 mm por grau</b></li><li>Hoje marca 52 mm: 52 − 38 = 14 mm → 14 ÷ 2 = 7 graus</li><li>20 + 7 = <b>27 °C</b> 🎉</li></ul><p class="muted">O gráfico de uma régua contra a outra é sempre uma <b>linha reta</b>.</p>`},
{e:'📌',t:'Cola da geladeira',m:'Fala em voz alta!',b:`<ul><li>🕺 Temperatura = tremedeira dos átomos</li><li>🍦 Calor = energia viajando do quente pro frio</li><li>🧊 Gelo derrete: 0 °C · 32 °F · 273 K</li><li>♨️ Água ferve: 100 °C · 212 °F · 373 K</li><li>🔬 K = °C + 273 · degraus iguais</li><li>🇺🇸 C/5 = (F − 32)/9</li></ul>`}
],
quiz:[
{q:'A temperatura de um corpo está associada:',o:['À quantidade de calor que ele possui','Ao grau de agitação (vibração) das suas partículas','À sua massa','À sua cor'],a:1,x:'Corpo não “possui” calor. Calor é energia em trânsito. Temperatura = vibração.'},
{q:'O painel do aeroporto marca 41 °F. Em Celsius isso é:',o:['5 °C — frio','16 °C — ameno','41 °C — muito quente','−9 °C — congelante'],a:0,x:'TC/5 = (41−32)/9 = 1 → TC = 5 °C.'},
{q:'Um gás está a 27 °C. Para usar em PV = nRT, a temperatura é:',o:['27 K','246 K','300 K','327 K'],a:2,x:'TK = 27 + 273 = 300 K.'},
{q:'Termômetro com números apagados: 20 °C ↔ 38 mm; 32 °C ↔ 62 mm. Quando a coluna mede 52 mm, a temperatura é:',o:['24 °C','26 °C','27 °C','30 °C'],a:2,x:'2 mm por °C. 52 − 38 = 14 mm → +7 °C → 27 °C.'},
{q:'Uma escala X marca 10 na fusão do gelo e 60 na ebulição da água. 40 °C corresponde a:',o:['20 X','30 X','40 X','50 X'],a:1,x:'(X−10)/(60−10) = 40/100 → X − 10 = 20 → X = 30.'},
{q:'Por que a escala Kelvin não tem valores negativos?',o:['Por convenção comercial','Porque seu zero é a ausência de vibração (zero absoluto)','Porque só mede temperaturas altas','Porque é dividida em 180 partes'],a:1,x:'Temperatura = vibração. Não existe vibração negativa.'},
{q:'O gráfico de uma escala termométrica em função de outra é sempre:',o:['Uma parábola','Uma reta (função do 1º grau)','Uma hipérbole','Uma exponencial'],a:1,x:'As fórmulas de conversão têm expoente 1 → função do 1º grau. Já caiu no PPL!'},
{q:'Qual temperatura é a mesma nas escalas Celsius e Fahrenheit?',o:['0','−40','32','100'],a:1,x:'T/5 = (T−32)/9 → 9T = 5T − 160 → T = −40.'}
],

{id:'calor',e:'🔥',c:'#ff7a2f',name:'Calorimetria',ds:'Que macete, que mala e o gráfico',
cards:[
{e:'🌡️',t:'Calor sensível: o que dá para sentir',m:'Esse calor faz o termômetro subir ou descer!',b:`<p>Quando o calor faz a temperatura <b>mudar</b>, ele se chama <b>sensível</b> (porque você sente a diferença).</p><p class="center"><span class="f">Q = m·c·Δθ</span> → “<b>Que macete</b>”</p><p><b>Q</b> = calor · <b>m</b> = massa · <b>c</b> = calor específico · <b>Δθ</b> = quanto a temperatura mudou</p>`},
{e:'🏖️',t:'Calor específico: a teimosia',m:'A água é a mais teimosa da turma!',b:`<p>O <b>c</b> diz o quanto uma coisa é <b>teimosa</b> para mudar de temperatura.</p><ul><li>💧 Água: c = 1 → muito teimosa (demora para esquentar e para esfriar)</li><li>🏖️ Areia: c = 0,15 → esquenta rapidinho</li></ul><p>Por isso, ao meio-dia, a areia queima o pé e o mar está geladinho, mesmo com o mesmo Sol nos dois! ☀️</p><div class="tip">c grande = <b>difícil</b> mudar a temperatura.</div>`},
{q:'Gelo a 0 °C recebendo calor (pressão de 1 atm):',o:['Esquenta','Derrete sem mudar a temperatura','Esfria','Vira vapor imediatamente'],a:1,x:'Enquanto troca de estado, o termômetro fica parado: o calor está sendo usado para derreter.'},
{e:'🤝',t:'Calor latente: trocar de estado',m:'As moléculas soltam as mãos!',b:`<p>No <b>gelo</b>, as moléculas estão de mãos dadas numa ciranda apertada. No <b>líquido</b>, as mãos ficam soltinhas. No <b>vapor</b>, cada uma corre para um lado!</p><p>Enquanto elas estão soltando as mãos, <b>todo o calor vai para isso</b> e o termômetro <b>fica parado</b>. Esse calor “escondido” se chama <b>latente</b>.</p><p class="center"><span class="f">Q = m·L</span> → “<b>Que mala</b>”</p><ul><li>Derreter 1 g de gelo: <b>80 cal</b></li><li>Ferver 1 g de água: <b>540 cal</b> (soltar de vez é bem mais difícil!)</li></ul>`},
{e:'👵',t:'O café da vovó',m:'Ferveu? Já está no máximo!',b:`<p>A vovó deixa a água “ferver mais um pouquinho para ficar bem quente”. Mas água fervendo fica em <b>100 °C</b> e <b>não passa disso</b>, por mais que ferva: o calor extra só vira vapor.</p><div class="warn">Durante a mudança de estado, a temperatura <b>não muda</b>.</div>`},
{e:'🪜',t:'A escada do gelo ao vapor',m:'São 5 degraus. Um de cada vez!',b:`<p>100 g de gelo a −10 °C virando vapor a 120 °C:</p><ol><li>🧊 Esquentar o gelo até 0 °C → <b>500 cal</b></li><li>💧 Derreter tudo → <b>8.000 cal</b></li><li>🫖 Esquentar a água até 100 °C → <b>10.000 cal</b></li><li>♨️ Ferver tudo → <b>54.000 cal</b></li><li>☁️ Esquentar o vapor até 120 °C → <b>1.000 cal</b></li></ol><p>Total: <b>73.500 cal</b>. Sensível, latente, sensível, latente, sensível!</p>`},
{e:'📈',t:'O gráfico das rampas e escadinhas',m:'Rampa = esquentando. Chão reto = trocando de estado.',b:`<p>No gráfico temperatura × calor, a escada vira:</p><ul><li>3 <b>rampas</b> subindo (sólido, líquido, vapor esquentando)</li><li>2 <b>trechos retos</b> (derretendo e fervendo)</li></ul><div class="tip">Trecho reto <b>comprido</b> → precisa de muito calor para trocar de estado.<br>Rampa <b>deitadinha</b> → muito calor para subir pouco = substância teimosa (c grande).</div>`},
{e:'🏊',t:'Capacidade térmica: o tamanho do tanque',m:'Capitão, meu camarada: C = m·c!',b:`<p>Uma <b>xícara</b> e uma <b>piscina</b> de água: qual demora mais para esquentar? A piscina, claro! Tem muito mais água.</p><p class="center"><span class="f">C = m·c</span> → “<b>Capitão, meu camarada</b>”</p><p><b>C</b> é o tamanho do “tanque de calor” de um objeto. As faíscas de uma lixa de metal estão a 800 °C e <b>não queimam</b> a pele: são tão pequenininhas que o tanque delas é quase zero. ✨</p>`},
{e:'☕',t:'Misturando quente com frio',m:'Parece uma gangorra!',b:`<p>Juntou um quente com um frio? O quente esfria, o frio esquenta, até ficarem <b>iguais</b>: é o equilíbrio térmico.</p><p class="center"><span class="f">ΣQ = 0</span> (o calor que um perde = o calor que o outro ganha)</p><ul><li>A temperatura final fica <b>entre</b> as duas.</li><li>Como numa gangorra, fica <b>mais perto de quem tem o tanque maior</b> (maior C).</li><li>Só fica bem no meio se os tanques forem <b>iguais</b>.</li></ul>`},
{q:'200 g de ferro (c = 0,1) a 400 °C entram em 400 g de água a 20 °C. A temperatura final fica mais perto de:',o:['400 °C, do ferro','210 °C, a média','20 °C, da água','Impossível estimar'],a:2,x:'Tanque do ferro: 200·0,1 = 20. Tanque da água: 400·1 = 400. A água ganha a gangorra: fica perto de 39 °C.'},
{e:'📌',t:'Cola da geladeira',m:'Agora sem olhar: consegue repetir?',b:`<ul><li>🌡️ Muda temperatura → <b>Que macete</b> (Q = m·c·Δθ)</li><li>🤝 Muda estado → <b>Que mala</b> (Q = m·L), termômetro parado</li><li>🏖️ c grande = teimoso (a água!)</li><li>🏊 Tanque de calor → <b>Capitão, meu camarada</b> (C = m·c)</li><li>☕ Mistura → fica perto do tanque maior</li></ul>`}
],
quiz:[
{q:'O fluido arrefecedor misturado à água do radiador deve ter, para cumprir sua função:',o:['Alto calor específico','Baixo calor específico','Alta condutividade elétrica','Baixa densidade'],a:0,x:'Não pode tirar da água a característica de regulador térmico: alto c. (ENEM 2015)'},
{q:'Ao meio-dia a areia queima o pé e a água do mar está fria. Isso porque:',o:['A água recebe menos radiação','A água tem maior calor específico','A areia tem maior calor específico','A água tem menor massa'],a:1,x:'Mesma radiação, mas a água precisa de mais energia para variar a temperatura.'},
{q:'Calor necessário para transformar 100 g de gelo a −10 °C em vapor a 120 °C (c_gelo = c_vapor = 0,5; Lf = 80; Lv = 540):',o:['13.000 cal','64.500 cal','73.500 cal','80.000 cal'],a:2,x:'500 + 8.000 + 10.000 + 54.000 + 1.000 = 73.500 cal.'},
{q:'No gráfico temperatura × calor de uma substância, o patamar de vaporização é bem mais comprido que o de fusão. Isso indica que:',o:['O calor latente de vaporização é maior','O calor específico do vapor é maior','A fusão ocorre a temperatura maior','A substância é impura'],a:0,x:'No eixo horizontal está o calor. Patamar longo = muito calor para mudar de estado.'},
{q:'No mesmo gráfico T×Q, a reta do líquido é mais “deitada” que a do sólido. Logo:',o:['c do líquido > c do sólido','c do líquido < c do sólido','São iguais','L de fusão é maior'],a:0,x:'Muito calor para pouca variação de temperatura = calor específico maior.'},
{q:'Fagulhas de um esmeril a ~800 °C tocam a pele e não queimam porque:',o:['Têm calor específico altíssimo','Têm capacidade térmica desprezível','Estão abaixo de 100 °C','São isolantes elétricos'],a:1,x:'Massa minúscula × c pequeno = C ≈ 0. Mesmo variando muito a temperatura, cedem pouco calor.'},
{q:'100 g de café (c = 1) a 77 °C vão numa xícara (C = 10 cal/°C) a 20 °C com 100 g de leite (c = 0,9) a 20 °C. A temperatura final é aproximadamente:',o:['20 °C','48,5 °C','77 °C','82 °C'],a:1,x:'C_café = 100; C_leite = 90 (+xícara 10). Capacidades parecidas → perto da média. ΣQ = 0 → 48,5 °C.'},
{q:'Uma usina dissipa 2 MW em água de rio que só pode aquecer 3 °C (c = 4 kJ/kg·°C). A vazão mínima de água é cerca de:',o:['67 kg/s','167 kg/s','667 kg/s','1.500 kg/s'],a:1,x:'P = (m/t)·c·Δθ → 2·10⁶ = vazão·4000·3 → vazão ≈ 167 kg/s. Olha a fórmula nº1 de novo! (ENEM)'},
{q:'Num calorímetro ideal, a temperatura de equilíbrio será a média aritmética das iniciais quando:',o:['As massas forem iguais','Os calores específicos forem iguais','As capacidades térmicas forem iguais','Sempre'],a:2,x:'“Termicamente iguais” = mesma capacidade térmica.'},
{q:'Para fundir 1 g de gelo são 80 cal; para vaporizar 1 g de água, 540 cal. Vaporizar é mais difícil porque:',o:['A água é mais densa','É preciso romper as ligações entre as moléculas','O vapor é invisível','A temperatura é maior'],a:1,x:'Na fusão você só enfraquece as ligações; na vaporização, rompe.'}
],

{id:'transmissao',e:'🌬️',c:'#2ee59d',name:'Transmissão de Calor & Fases',ds:'Difusão, arrasto, infravermelho',
cards:[
{e:'🪣',t:'Condução: passa pela fila',m:'É igual fofoca: passa de um para o outro!',b:`<p>Coloque uma colher de metal no café quente: logo o cabo esquenta. Os átomos da ponta começam a tremer e <b>empurram o vizinho</b>, que empurra o próximo... ninguém sai do lugar, só o tremor passa. É a <b>difusão</b>, como uma fofoca!</p><ul><li>Metais são ótimos [[condutores]]</li><li>Madeira, plástico, lã e ar são [[isolantes]]</li><li>Precisa de matéria: no [[vácuo]] não acontece</li></ul>`},
{e:'🎡',t:'Convecção: a roda-gigante',m:'Quente sobe, frio desce!',b:`<p>A água no fundo da panela esquenta, fica “levinha” (menos [[densa]]) e <b>sobe</b>. A de cima, mais fria e “pesadinha”, <b>desce</b>. Fica girando como uma roda-gigante: são as <b>correntes de convecção</b>.</p><ul><li>Só em líquidos e gases (eles conseguem se arrastar)</li><li>Para <b>esquentar</b>, o fogo fica <b>embaixo</b></li><li>Para <b>esfriar</b>, o frio fica <b>em cima</b> (ar-condicionado e congelador lá no alto)</li></ul>`},
{e:'☀️',t:'Radiação: a luz invisível do calor',m:'Esse calor viaja até pelo espaço!',b:`<p>O calor do Sol atravessa o espaço vazio até chegar aqui. Ele viaja como uma luz que nossos olhos não veem: o <b>infravermelho</b>.</p><p>Tudo que está quente solta infravermelho. Por isso:</p><ul><li>🌡️ o termômetro de testa mede febre sem encostar</li><li>💡 o sensor acende a luz quando você passa</li><li>🐍 algumas cobras “veem” presas no escuro</li></ul>`},
{q:'Qual forma de transmissão de calor NÃO precisa de meio material?',o:['Condução','Convecção','Radiação'],a:2,x:'Radiação é infravermelho, uma onda que viaja até no espaço vazio.'},
{e:'🧥',t:'Casaco não esquenta!',m:'Ele só fecha a porta para o calor não fugir.',b:`<ul><li>Sentir <b>frio</b> = seu corpo está <b>perdendo calor</b> rápido demais</li><li>Sentir <b>quente</b> = seu corpo está <b>ganhando calor</b> demais</li></ul><p>O casaco de lã não tem pilha! Ele só é uma <b>porta fechada</b>: o ar preso entre os pelinhos impede o calor do seu corpo de escapar.</p><p>Por isso o povo do deserto usa lã: a mesma porta impede o calor de fora de <b>entrar</b>. 🐪</p>`},
{e:'💦',t:'Suor, vento e abafado',m:'Quando o suor seca, ele leva calor junto!',b:`<p>Para o suor virar vapor ([[evaporação]]), ele <b>rouba calor</b> da sua pele. É assim que o corpo se refresca.</p><ul><li>🌬️ <b>Vento</b> ajuda o suor a secar → sensação mais fresca</li><li>💧 Ar <b>úmido</b> atrapalha o suor a secar → sensação de abafado</li></ul><p>Rio de Janeiro: 43 °C, mas sensação de 63 °C, porque estava úmido e sem vento.</p>`},
{e:'🚗',t:'Efeito estufa: o carro no sol',m:'Já entrou num carro que ficou no sol?',b:`<p>A luz do Sol entra pelo vidro, esquenta o banco, e o banco solta <b>infravermelho</b>. Só que o vidro <b>não deixa o infravermelho sair</b>. O calor fica preso!</p><p>Em volta da Terra, o <b>gás carbônico (CO₂)</b> e o vapor d’água fazem o papel do vidro.</p><ul><li>Um pouco é bom: sem ele a Terra seria geladíssima como a Lua 🌕</li><li>Demais (queimando petróleo e carvão) → <b>aquecimento global</b> 🌍🔥</li></ul>`},
{e:'🛏️',t:'O cobertor perfeito',m:'Lã, grosso e você encolhidinho!',b:`<p>O fluxo de calor que passa por uma parede ou cobertor é:</p><p class="center"><span class="f">φ = k·A·Δθ / L</span></p><ul><li><b>k</b> pequeno → material isolante (lã)</li><li><b>L</b> grande → cobertor <b>grosso</b> (L é a espessura!)</li><li><b>A</b> pequena → dormir <b>encolhido</b></li></ul><p>Tudo isso deixa passar menos calor. Quentinho! 😴</p>`},
{e:'🍲',t:'Pressão muda a fervura',m:'Na montanha a água ferve “fria”!',b:`<ul><li>⛰️ No alto da montanha o ar aperta menos → a água ferve antes de 100 °C (em Machu Picchu, ~87 °C). O arroz demora mais!</li><li>🍲 A <b>panela de pressão</b> aperta mais → a água ferve a ~120 °C → o feijão cozinha rapidinho.</li><li>⛸️ A lâmina do patins aperta muito o gelo num pontinho → o gelo derrete embaixo e a pessoa desliza.</li></ul>`},
{e:'📌',t:'Cola da geladeira',m:'Três palavras mágicas!',b:`<ul><li>🪣 Condução → <b>difusão</b> (fofoca, precisa encostar)</li><li>🎡 Convecção → <b>arrasto</b> (quente sobe, frio desce)</li><li>☀️ Radiação → <b>infravermelho</b> (vai até no espaço)</li><li>🧥 Casaco isola, não esquenta</li><li>🚗 Estufa: luz entra, infravermelho fica preso</li><li>🍲 Mais pressão → ferve mais quente</li></ul>`}
],
quiz:[
{q:'Por que o congelador fica na parte de cima da geladeira?',o:['Para facilitar o acesso','O ar frio, mais denso, desce e cria correntes de convecção','O frio sobe por condução','Para evitar radiação'],a:1,x:'Para resfriar por convecção, a fonte fria fica em cima.'},
{q:'O termômetro de testa, usado na pandemia, funciona detectando:',o:['Ultravioleta','Infravermelho','Luz visível','Raio X'],a:1,x:'Todo corpo quente emite infravermelho; mais quente, mais emite.'},
{q:'Moradores do deserto usam roupas de lã porque a lã:',o:['Gera calor','É isolante e impede que eles ganhem muito calor do ambiente','Reflete raio X','Aumenta a evaporação'],a:1,x:'O que impede o calor de sair também impede o calor de entrar.'},
{q:'No Rio, 43,5 °C com sensação de 63,7 °C. A melhor explicação:',o:['O termômetro estava errado','Umidade alta e falta de vento dificultam a evaporação do suor','Excesso de ultravioleta','A areia aquece o ar'],a:1,x:'Umidade concorre com o suor; sem vento, nada ajuda a evaporar.'},
{q:'Um pano molhado queima a mão ao pegar a assadeira quente, e o seco não. Por quê?',o:['A água conduz o calor melhor que o ar entre as fibras','A água é condutora elétrica','O pano molhado fica mais fino','A água reflete infravermelho'],a:0,x:'Ambos são isolantes, mas o ar é bem mais. Trocar ar por água aumenta a condução. (Mesmo motivo de envolver a lata com papel molhado para gelar mais rápido.)'},
{q:'No efeito estufa, o CO₂ e o vapor d’água são:',o:['Opacos à luz e transparentes ao infravermelho','Transparentes à luz/UV e opacos ao infravermelho','Opacos a tudo','Transparentes a tudo'],a:1,x:'A energia entra como luz/UV e tenta sair como infravermelho, que fica preso.'},
{q:'Pela lei de Fourier, um cobertor mais grosso esquenta mais porque:',o:['Aumenta k','Aumenta L e diminui o fluxo de calor','Aumenta a área','Produz calor'],a:1,x:'φ = kAΔθ/L. L no denominador: maior espessura, menor fluxo.'},
{q:'Fluxo de calor de 400 kcal/h, área 10 m², espessura 0,2 m, Δθ = 10 °C. A constante k (kcal/h·m·°C) é:',o:['0,2','0,8','4','20'],a:1,x:'400 = k·10·10/0,2 → 400 = 500k → k = 0,8. (ENEM 2025 reaplicação)'},
{q:'A panela de pressão cozinha mais rápido porque:',o:['Esquenta a água acima de 100 °C ao aumentar a pressão','Diminui o calor latente','Usa menos água','Elimina a convecção'],a:0,x:'Mais pressão → maior temperatura de ebulição (~120 °C).'},
{q:'Em Machu Picchu (~3700 m) a água ferve a cerca de 87 °C. Consequência:',o:['O arroz cozinha mais rápido','O arroz demora mais para cozinhar','A água não ferve','Nada muda'],a:1,x:'Pressão menor → ferve a temperatura menor → cozimento mais lento.'},
{q:'A lâmina do patins permite deslizar no gelo porque:',o:['Esquenta o gelo por atrito apenas','A alta pressão numa área pequena derrete o gelo (água tem curva de fusão decrescente)','Tem calor específico alto','Emite infravermelho'],a:1,x:'Pressão = F/A. Área minúscula → pressão enorme → o gelo derrete e depois recongela.'},
{q:'A hora mais fria do dia costuma ser:',o:['Meia-noite','Logo antes do sol nascer','Meio-dia','Final da tarde'],a:1,x:'É o maior tempo sem receber radiação, só perdendo infravermelho.'}
],

{id:'eletro',e:'🔌',c:'#ffcf3f',name:'Eletrodinâmica',ds:'O assunto nº 1 do ENEM',
cards:[
{e:'🚰',t:'Corrente: elétrons passeando',m:'Pense num cano cheio de água!',b:`<p>Dentro do fio existem [[elétrons]] que podem andar. Quando eles andam juntos, temos a [[corrente]] elétrica, como água andando num cano.</p><p class="center"><span class="f">i = Q/Δt</span> e <span class="f">Q = n·e</span></p><p><b>Q</b> = quantidade de carga · <b>n</b> = número de elétrons · <b>e</b> = 1,6×10⁻¹⁹ (a cargazinha de um elétron)</p><div class="tip">Viu o número <b>1,6×10⁻¹⁹</b>? É sinal de que você vai usar <b>Q = n·e</b>.</div>`},
{e:'🔋',t:'A bateria é uma caixa-d’água',m:'mAh mostra o tamanho do tanque!',b:`<p>A bateria do celular diz <b>4400 mAh</b>. Isso é o tamanho da caixa-d’água de carga (A·h é carga!).</p><p>Se o aparelho gasta <b>2 A</b> (a “torneira”), a conta é:</p><p class="center">4,4 A·h ÷ 2 A = <b>2,2 horas</b> = 132 minutos</p>`},
{e:'🚶',t:'Resistência: corredor lotado',m:'Quanto mais trombada, mais difícil passar!',b:`<p>Andar num corredor cheio de gente é difícil. Para os elétrons, os átomos do fio são essa gente: isso é a [[resistência]].</p><p class="center"><span class="f">R = ρ·L/A</span></p><ul><li>Corredor <b>comprido</b> (L grande) → mais trombadas</li><li>Corredor <b>largo</b> (A grande) → passa fácil</li><li>Corredor <b>quente</b> → a multidão pula mais → mais trombadas</li></ul><p>Supercondutor: tão gelado que ninguém se mexe e os elétrons passam sem trombar! 🧊</p>`},
{q:'Dobrando o comprimento de um fio e mantendo o resto, a resistência:',o:['Cai pela metade','Dobra','Quadruplica','Não muda'],a:1,x:'Corredor duas vezes mais comprido = o dobro de trombadas.'},
{e:'💡',t:'Por que a luz acende na hora?',m:'Os elétrons andam devagarzinho!',b:`<p>Os elétrons andam muito devagar no fio (menos de 1 milímetro por segundo!). Então por que a lâmpada acende na hora?</p><p>Imagine um tubo <b>já cheio</b> de bolinhas encostadas. Empurrou uma ponta, sai uma bolinha do outro lado <b>na hora</b>. O fio já está cheio de elétrons: a pilha só cria um “empurrão” (o <b>campo elétrico</b>) que chega quase na velocidade da luz em todo o fio.</p>`},
{e:'🔥',t:'Efeito Joule: trombada vira calor',m:'É assim que o chuveiro esquenta a água!',b:`<p>Cada trombada dos elétrons com os átomos gera <b>calor</b>: chuveiro, torradeira, secador.</p><p>A corrente <b>não diminui</b> depois de passar! O que cai é o “empurrão” (a [[tensão]]), como água descendo uma escada: a mesma quantidade passa, mas a altura diminui.</p><p class="center"><span class="f">U = R·i</span></p><p>10 Ω com 5 A → o empurrão cai 50 V.</p>`},
{q:'Depois de atravessar um resistor, a intensidade da corrente:',o:['Diminui','Aumenta','Continua igual'],a:2,x:'A corrente continua igual. O que cai é a tensão (o empurrão).'},
{e:'🧾',t:'Potência e a conta de luz',m:'Banho demorado custa caro!',b:`<p><span class="f">P = U·i</span> <span class="f">P = R·i²</span> <span class="f">P = U²/R</span></p><p>Energia gasta: <span class="f">E = P·Δt</span>, medida em <b>kWh</b> na conta de luz.</p><p>Chuveiro de 5,4 kW ligado 20 horas no mês: 5,4 × 20 = 108 kWh. A R$ 1,10 cada → <b>R$ 118,80</b> só de banho! 🚿💸</p>`},
{e:'🔌',t:'Ligou na tomada errada',m:'O fio de dentro continua o mesmo!',b:`<p>Chuveiro de 5500 W para 110 V: a corrente é 5500 ÷ 110 = <b>50 A</b> e a resistência é 110² ÷ 5500 ≈ <b>2,2 Ω</b>.</p><div class="tip">Ligou em 220 V por engano? A <b>resistência não muda</b> (é o mesmo fio lá dentro!). Com P = U²/R e o dobro da tensão, a potência fica <b>4 vezes</b> maior. Queima! 💥</div>`},
{e:'🚿',t:'O segredo do chuveiro',m:'Menos resistência = água MAIS quente. Estranho, né?',b:`<ul><li>❄️ <b>Fria</b>: o circuito fica aberto</li><li>🌤️ <b>Morna</b>: usa a resistência <b>inteira</b></li><li>🔥 <b>Quente</b>: usa só <b>metade</b> da resistência</li></ul><p>Na casa a tensão não muda, então use <span class="f">P = U²/R</span>: resistência menor → potência maior.</p><p>Por quê? Com menos resistência passa <b>muito mais corrente</b>, e a corrente conta <b>ao quadrado</b>.</p>`},
{e:'📌',t:'Cola da geladeira',m:'Último resumo. Bora!',b:`<ul><li>🚰 Corrente: i = Q/Δt · Q = n·e</li><li>🔋 mAh é tamanho do tanque de carga</li><li>🚶 Fio comprido atrapalha, fio grosso ajuda: R = ρL/A</li><li>🔥 Corrente não diminui; a tensão cai: U = R·i</li><li>🔌 Tomada errada: R não muda</li><li>🚿 Quente = menos resistência (P = U²/R)</li></ul>`}
],
quiz:[
{q:'Ao fechar o interruptor, a lâmpada acende quase instantaneamente por causa da rapidez:',o:['Dos elétrons que saem da bateria','De um fluido elétrico','Do campo elétrico que se estabelece em todo o circuito','Das cargas positivas e negativas que colidem'],a:2,x:'Os elétrons andam devagar; o campo é que chega quase à velocidade da luz. (ENEM 2013)'},
{q:'Um raio transporta corrente média de 30.000 A por 80 µs. Com e = 1,6×10⁻¹⁹ C, o número de elétrons é:',o:['2,4','1,5×10¹⁹','3,8×10¹⁸','4,8×10²⁰'],a:1,x:'Q = 3·10⁴ · 80·10⁻⁶ = 2,4 C. n = 2,4/1,6·10⁻¹⁹ = 1,5·10¹⁹. (Quem esquece o Q = n·e marca “2,4 elétrons” 😅)'},
{q:'Bateria de notebook de 4400 mAh alimentando 2 A dura:',o:['44 min','66 min','132 min','220 min'],a:2,x:'4,4 A·h ÷ 2 A = 2,2 h = 132 min. (ENEM)'},
{q:'“A·h”, que aparece nas baterias, é unidade de:',o:['Corrente','Potência','Carga elétrica','Tensão'],a:2,x:'Corrente × tempo = carga (Q = i·Δt).'},
{q:'Chuveiro de 5500 W / 110 V. A corrente nominal é:',o:['2,2 A','5 A','50 A','605 A'],a:2,x:'P = U·i → i = 5500/110 = 50 A. E R = U²/P ≈ 2,2 Ω.'},
{q:'Na posição “quente” do chuveiro, a resistência ligada é:',o:['A maior','A menor','Nenhuma','Igual à da morna'],a:1,x:'U constante → P = U²/R. Menor R → maior potência.'},
{q:'Um chuveiro de 5400 W/220 V (Brasília) e outro de 5400 W/110 V (BH), usados pelo mesmo tempo, consomem:',o:['O de 220 V gasta o dobro','O de 110 V gasta o dobro','A mesma energia','O de 220 V gasta 4×'],a:2,x:'E = P·Δt. Mesma potência e mesmo tempo → mesmo consumo. Muda a resistência (a de 220 V é 4× maior).'},
{q:'Um aparelho de 110 V é ligado por engano em 220 V. A potência dissipada:',o:['Fica igual','Dobra','Quadruplica','Cai pela metade'],a:2,x:'R não muda. P = U²/R: tensão 2× → potência 4×.'},
{q:'Supercondutores conduzem sem resistência quando:',o:['Estão muito quentes','Estão a temperaturas extremamente baixas','São muito longos','São finos'],a:1,x:'ρ cai com a temperatura; perto do zero absoluto os átomos quase não atrapalham.'},
{q:'Dobrando o comprimento de um fio e mantendo o resto, a resistência:',o:['Cai pela metade','Dobra','Quadruplica','Não muda'],a:1,x:'R = ρL/A: diretamente proporcional ao comprimento.'},
{q:'Chuveiro de 5,4 kW, usado 20 h no mês, com tarifa de R$ 1,10/kWh. Custo:',o:['R$ 11,88','R$ 59,40','R$ 118,80','R$ 1.188,00'],a:2,x:'E = 5,4·20 = 108 kWh. 108 × 1,10 = R$ 118,80.'},
{q:'Uma corrente de 5 A passa por um resistor de 10 Ω. A queda de potencial nele é:',o:['2 V','15 V','50 V','500 V'],a:2,x:'U = R·i = 10·5 = 50 V.'}
],

{id:'ondas',e:'🌊',c:'#7c5cff',name:'Ondulatória',ds:'Meio, fonte, fórmula e fenômenos',
cards:[
{e:'🏟️',t:'O que é uma onda?',m:'Já fez a “ola” no estádio?',b:`<p>Na “ola” do estádio, cada pessoa só levanta e senta no lugar, mas a [[onda]] dá a volta inteira! Onda leva <b>energia</b>, não leva as coisas.</p><ul><li>🔝 <b>Crista</b>: o ponto mais alto · 🔻 <b>Vale</b>: o mais baixo</li><li>📐 <b>Amplitude</b>: a altura da onda (mais alta = mais energia)</li><li>📏 <b>λ</b> ([[comprimento de onda]]): tamanho de uma onda inteira</li></ul>`},
{e:'🪢',t:'Frequência: pular corda',m:'Quantos pulos por segundo?',b:`<p>Pulou corda 2 vezes em 1 segundo? A [[frequência]] é <b>2 Hz</b> (hertz = vezes por segundo).</p><p>O tempo de um pulo inteiro é o <b>período</b> (T). Se dá 2 pulos por segundo, cada pulo leva meio segundo.</p><p class="center"><span class="f">f = 1/T</span></p>`},
{e:'🧭',t:'A bússola das ondas',m:'Essa regra resolve um monte de questão!',b:`<p class="center"><span class="f">v = λ·f</span> → “<b>vaca lambe farinha</b>” 🐄</p><div class="tip">Quer a <b>velocidade</b>? Olhe o <b>MEIO</b> (ar, água, vidro...).<br>Quer a <b>frequência</b>? Olhe a <b>FONTE</b> (ela é a “mãe” e a frequência <b>nunca muda</b>).<br>Quer o <b>λ</b>? Olhe a <b>FÓRMULA</b>.</div><p>Rádio AM (610 kHz) e FM (95,4 MHz) no ar têm a mesma velocidade. A AM tem frequência menor, então tem λ <b>maior</b>.</p>`},
{q:'Uma onda passa do ar para a água. O que com certeza NÃO muda?',o:['Velocidade','Comprimento de onda','Frequência'],a:2,x:'Frequência vem da fonte, a “mãe” da onda. Nunca muda!'},
{e:'🔦',t:'Quicar e entortar',m:'Reflexão é quicar. Refração é mudar de meio.',b:`<ul><li>🏀 <b>Reflexão</b>: a onda bate e volta, como bola na parede. Fica tudo igual.</li><li>🥢 <b>Refração</b>: a onda muda de meio e de velocidade. Por isso o canudo parece quebrado no copo!</li></ul><p>💡 A <b>luz</b> fica mais <b>lenta</b> na água.<br>🔊 O <b>som</b> fica mais <b>rápido</b> na água (o som adora matéria!).</p>`},
{e:'❤️',t:'A pegadinha do eletrocardiograma',m:'Olhe o que está escrito embaixo do gráfico!',b:`<p>No eletrocardiograma, a linha de baixo é o <b>tempo</b>. Então a distância de um pico até o outro é o <b>tempo de uma batida</b> (o período), não o λ!</p><p>5 quadradinhos de 0,2 s = 1 segundo por batida → 60 batidas por minuto.</p>`},
{e:'🚀',t:'Os três tipos de onda',m:'No espaço ninguém ouve você gritar!',b:`<ul><li>🔊 <b>Mecânica</b> (som, onda na água): precisa de matéria para andar. No espaço não tem som! Explosão barulhenta em filme é invenção. 🎬</li><li>💡 <b>Eletromagnética</b> (luz, rádio, raio X): anda até no [[vácuo]], a 300.000 km por segundo!</li><li>🌌 <b>Gravitacional</b>: o próprio espaço balançando, quando dois buracos negros se trombam. Prevista por Einstein!</li></ul>`},
{e:'🌈',t:'O arco-íris gigante',m:'A maior parte dele é invisível!',b:`<p>Da menor para a maior frequência:</p><p>📻 rádio → 🍿 micro-ondas → 🔥 infravermelho → 🌈 <b>luz</b> (vermelho até violeta) → 🧴 ultravioleta → 🦴 raio X → ☢️ gama</p><ul><li>Andando para a direita, a onda fica mais <b>forte</b> e entra mais fundo no corpo.</li><li>Do <b>ultravioleta</b> em diante, pode estragar o DNA (por isso usamos protetor solar!).</li><li>Micro-ondas e celular <b>não</b> têm essa força.</li></ul>`},
{e:'🎠',t:'Ressonância: o balanço',m:'Empurre no ritmo certo e voa alto!',b:`<p>No balanço do parquinho, se você empurra <b>no ritmo certo</b>, ele sobe cada vez mais. Isso é <b>ressonância</b>: a onda tem a mesma frequência que a coisa gosta de balançar.</p><ul><li>🍷 A cantora acerta a nota e a taça de cristal quebra</li><li>📻 Sintonizar o rádio é escolher o ritmo da estação</li></ul>`},
{e:'🐱',t:'Eco e ouvir atrás do muro',m:'O som faz curva. A luz, não!',b:`<ul><li>🏔️ <b>Eco</b>: o som bate e volta. Para ouvir separado, a parede precisa estar a pelo menos <b>17 m</b>.</li><li>🧱 <b>Difração</b>: a onda faz a curva em volta de um obstáculo. Só funciona se ela tiver um tamanho parecido com ele.</li></ul><p>O miado do gato tem λ de uns 3 metros (do tamanho de um muro) e faz a curva. A luz é minúscula e não faz. Você <b>ouve</b> o gato, mas <b>não vê</b>!</p>`},
{e:'📌',t:'Cola da geladeira',m:'Você chegou ao fim. Que orgulho!',b:`<ul><li>🏟️ Onda leva energia, não leva coisas</li><li>🐄 v = λ·f · meio, fonte, fórmula</li><li>🧬 Frequência nunca muda</li><li>🔊 Som não anda no vácuo; luz anda</li><li>🌈 Do UV para cima: perigoso</li><li>🎠 Ressonância = ritmo certo</li><li>🐱 Som faz curva (difração), luz não</li></ul>`}
],

const GALIAS={'átomos':'átomo','condutores':'condutor','isolantes':'isolante','densa':'densidade','elétrons':'elétron'};
function gk(t){t=t.toLowerCase();return GALIAS[t]||t}
function gl(html){return html.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>GLOSS[gk(t)]?`<button class="gl" data-k="${gk(t)}">${t}</button>`:t)}
function bindGloss(){app.querySelectorAll('.gl').forEach(b=>b.onclick=e=>{e.stopPropagation();sfx('tap');showGloss(b.dataset.k)})}
function showGloss(k){const old=document.querySelector('.glpop');if(old)old.remove();const d=document.createElement('div');d.className='glpop';d.innerHTML=`<b>📚 ${k[0].toUpperCase()+k.slice(1)}</b><p>${GLOSS[k]}</p><button class="btn ghost">Entendi!</button>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove()}
function speak(txt){try{const ss=window.speechSynthesis;if(!ss){toast('Seu navegador não sabe ler em voz alta 😢');return}if(ss.speaking){ss.cancel();return}
 txt=txt.replace(/<[^>]+>/g,' ').replace(/·/g,' vezes ').replace(/²/g,' ao quadrado ').replace(/Δ/g,'variação de ').replace(/√/g,'raiz de ').replace(/\//g,' dividido por ').replace(/→/g,', ').replace(/λ/g,' lambda ').replace(/η/g,' rendimento ').replace(/τ/g,' trabalho ').replace(/φ/g,' fluxo ').replace(/\s+/g,' ');
 const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=.95;const v=ss.getVoices().find(v=>/pt/i.test(v.lang));if(v)u.voice=v;ss.speak(u)}catch(e){toast('Não deu para ler em voz alta aqui 😢')}}
function stopSpeak(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
const PRAISE=['✅ Mandou bem!','✅ Você é fera!','✅ Isso aí!','✅ Arrasou!','✅ Cérebro turbinado!','✅ Acertou em cheio!'];

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();W.forEach(w=>{if(S.w[w.id].lesson&&!S.w[w.id].lessonAt)S.w[w.id].lessonAt=Date.now()});

(function(){const t=new Date().toISOString().slice(0,10);if(S.streak.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;save();}})();

const app=document.getElementById('app');
let timers=[];

function h(html){clearTimers();stopSpeak();const gp=document.querySelector('.glpop');if(gp)gp.remove();app.innerHTML=html;window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function on(sel,fn){app.querySelectorAll(sel).forEach(el=>el.onclick=e=>fn(el,e))}
function level(){return Math.floor(S.xp/150)+1}
function title(){return LEVELS[Math.min(level()-1,LEVELS.length-1)]}
function addXP(n){const l=level();S.xp+=n;save();if(level()>l){sfx('lvl');confetti();toast(`🎉 Subiu para o nível ${level()}: ${title()}!`)}}
function floatTxt(t){const d=document.createElement('div');d.className='float';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let AC;function sfx(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,.08],[880,.12]],bad:[[220,.18]],lvl:[[523,.1],[659,.1],[784,.1],[1047,.25]],tap:[[500,.04]]}[k];let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
function confetti(){const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffcf3f','#7c5cff','#00d4ff','#2ee59d','#ff5c7a'];let p=Array.from({length:140},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.r+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++n<120)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function stars(id){const s=S.w[id],w=W.find(x=>x.id===id);let n=0;if(s.lesson)n++;if(s.quiz>=.7)n++;if(w.games.every((g,i)=>s.games[i]&&s.games[i].pass))n++;return n}
function unlocked(i){return S.free||i===0||S.w[W[i-1].id].quiz>=.7}
function bossUnlocked(){return S.free||W.every(w=>S.w[w.id].quiz>=.7)}
function setNav(k){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===k))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{sfx('tap');go[b.dataset.nav]()});
function topbar(t,back){return `<div class="top"><button class="back" id="bk">←</button><h2>${t}</h2></div>`}
function bindBack(fn){const b=document.getElementById('bk');if(b)b.onclick=()=>{sfx('tap');fn()}}

 <div class="hero"><div class="big">⚛️</div><h1>Física Quest</h1><p>Nível ${level()} · <b>${title()}</b></p>
 <div class="bar"><i style="width:${(S.xp%150)/1.5}%"></i></div><p style="font-size:13px;margin:6px 0 0">${150-S.xp%150} XP para o próximo nível</p></div>
 <button class="daily" id="daily" style="width:100%;text-align:left"><div class="e">🎁</div><div><b class="ttl" style="font-size:18px">Desafio do dia</b><div class="muted" style="font-size:13px">1 questão surpresa · +30 XP</div></div></button>

 <div class="map">${W.map((w,i)=>{const u=unlocked(i),st=stars(w.id);return `<button class="node ${u?'':'locked'} ${i===nextI?'next':''}" data-i="${i}">
   <div class="ic" style="background:${w.c}">${u?w.e:'🔒'}</div><div><div class="muted" style="font-size:12px">MUNDO ${i+1}</div><div class="nm">${w.name}</div><div class="ds">${w.ds}</div><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div></div></button>`}).join('')}

 </div>`);
 on('.node[data-i]',el=>{const i=+el.dataset.i;if(!unlocked(i)){vib(80);toast('🔒 Passe no quiz do mundo anterior (70%) para liberar!');return}sfx('tap');go.world(W[i].id)});
 document.getElementById('boss').onclick=()=>{if(!bossUnlocked()){toast('🔒 Passe nos quizzes de todos os mundos primeiro!');return}go.bossIntro()};
 const rc=document.getElementById('recall');if(rc)rc.onclick=()=>runQuiz(shuffle(recall.quiz).slice(0,3),{title:'🧠 Relembrar',onEnd:r=>{S.w[recall.id].recallAt=Date.now();if(r.right)addXP(25);save();go.home()}});
 document.getElementById('daily').onclick=()=>{const t=new Date().toISOString().slice(0,10);if(S.dailyDone===t){toast('✅ Desafio de hoje feito! Volte amanhã.');return}
