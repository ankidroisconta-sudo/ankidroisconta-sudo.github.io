};

go.world=function(id){setNav('home');const w=W.find(x=>x.id===id),s=S.w[id];
 h(`${topbar(w.e+' '+w.name)}
 <div class="hero" style="background:linear-gradient(135deg,${w.c},#2a2e5e)"><div class="big">${w.e}</div><p style="margin:0">${w.ds}</p><div class="stars" style="font-size:24px;margin-top:6px">${'⭐'.repeat(stars(id))}${'☆'.repeat(3-stars(id))}</div></div>
 <button class="step" id="l"><div class="n">📖</div><div class="t"><b>1. Lição relâmpago</b><span>${w.cards.length} cards com macetes</span></div>${s.lesson?'✅':'▶️'}</button>
 <button class="step" id="q"><div class="n">🧩</div><div class="t"><b>2. Quiz estilo ENEM</b><span>${w.quiz.length} questões · melhor: ${Math.round(s.quiz*100)}% (precisa de 70%)</span></div>${s.quiz>=.7?'✅':'▶️'}</button>
 ${w.games.map((g,i)=>`<button class="step" data-g="${i}"><div class="n">🎮</div><div class="t"><b>${3+i}. ${g.title}</b><span>${g.sub}</span></div>${s.games[i]&&s.games[i].pass?'✅':'▶️'}</button>`).join('')}
 <p class="muted center" style="font-size:13px">Dica: faça a lição antes do quiz. Cada erro vai para a aba 🎯 Erros para você revisar.</p>`);
 bindBack(go.home);
 document.getElementById('l').onclick=()=>go.lesson(id,0);
 document.getElementById('q').onclick=()=>runQuiz(shuffle(w.quiz),{title:w.e+' Quiz',wid:id,onEnd:()=>go.world(id)});
 on('[data-g]',el=>go.game(id,+el.dataset.g));
};

go.lesson=function(id,i){const w=W.find(x=>x.id===id),c=w.cards[i],last=i===w.cards.length-1;
 const dots=`<div class="dots">${w.cards.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
 if(c.q){ // checagem rápida
  h(`${topbar('⚡ Checagem rápida')}${dots}<div class="mascot"><span>⚛️</span><p>Pausa para pensar! Responda para continuar.</p></div><div class="lcard"><div class="em">🤔</div><h3>${c.q}</h3><div id="ops">${shuffle(c.o.map((t,k)=>({t,k}))).map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div><div id="ex"></div></div>`);
  bindBack(()=>go.world(id));
  on('#ops .opt',el=>{if(app.querySelector('.opt.ok'))return;const k=+el.dataset.k;
   if(k===c.a){el.classList.add('ok');sfx('ok');addXP(5);floatTxt('+5');document.getElementById('ex').innerHTML=`<div class="exp"><b class="k">${pick(PRAISE)}</b> ${c.x}</div><button class="btn g" id="nx">Continuar →</button>`;document.getElementById('nx').onclick=()=>last?finishLesson(id):go.lesson(id,i+1)}
   else{el.classList.add('bad');sfx('bad');vib(120);el.disabled=true;document.getElementById('ex').innerHTML=`<div class="exp"><b class="x">Quase!</b> Tente de novo. 💪</div>`}});
  return}
 h(`${topbar(w.e+' Lição')}${dots}${c.m?`<div class="mascot"><span>⚛️</span><p>${c.m}</p></div>`:''}<div class="lcard"><button class="say" id="say" aria-label="Ouvir">🔊 Ouvir</button><div class="em">${c.e}</div><h3>${c.t}</h3>${gl(c.b)}<p class="muted" style="font-size:12px;margin-top:14px">💡 Palavras <span class="gl" style="pointer-events:none">sublinhadas</span> têm explicação: toque nelas!</p></div>
 <div class="row">${i>0?'<button class="btn ghost" id="pv">← Voltar</button>':''}<button class="btn ${last?'y':''}" id="nx">${last?'Concluir 🎉':'Próximo →'}</button></div>`);
 bindBack(()=>go.world(id));bindGloss();document.getElementById('say').onclick=()=>speak(c.t+'. '+c.b.replace(/\[\[|\]\]/g,''));
 if(i>0)document.getElementById('pv').onclick=()=>go.lesson(id,i-1);
 document.getElementById('nx').onclick=()=>{sfx('tap');last?finishLesson(id):go.lesson(id,i+1)};
 let sx=null;const lc=app.querySelector('.lcard');lc.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});lc.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(dx<-60)last?finishLesson(id):go.lesson(id,i+1);else if(dx>60&&i>0)go.lesson(id,i-1);sx=null});
};
function finishLesson(id){const first=!S.w[id].lesson;S.w[id].lesson=true;if(!S.w[id].lessonAt)S.w[id].lessonAt=Date.now();save();if(first){addXP(30);confetti();sfx('lvl')}checkBadges();
 h(`<div class="result"><div class="bigst">📖✨</div><h2>Lição concluída!</h2><p class="muted">${first?'+30 XP':'Revisão feita'} — agora prove que aprendeu.</p><button class="btn g" id="q">Ir para o quiz 🧩</button><button class="btn ghost" id="b">Voltar ao mundo</button></div>`);
 const w=W.find(x=>x.id===id);document.getElementById('q').onclick=()=>runQuiz(shuffle(w.quiz),{title:w.e+' Quiz',wid:id,onEnd:()=>go.world(id)});document.getElementById('b').onclick=()=>go.world(id)}

/* ---------- motor de quiz ---------- */
let Q;
function runQuiz(qs,opts){Q={qs,i:0,right:0,combo:0,wrong:[],opts,lives:opts.lives||0};showQ()}
function showQ(){const q=Q.qs[Q.i],o=Q.opts;const ord=shuffle(q.o.map((t,k)=>({t,k})));
 h(`${topbar(o.title)}<div class="hud" style="justify-content:space-between"><span class="pill">${Q.i+1}/${Q.qs.length}</span>${o.lives?`<span class="hearts">${'❤️'.repeat(Q.lives)}${'🖤'.repeat(3-Q.lives)}</span>`:''}<span class="pill combo">🔥 x${Q.combo}</span></div>
 <div class="bar" style="margin:10px 0"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>${o.time?'<div class="timer"><i id="tm" style="width:100%"></i></div>':''}
 <div class="qtxt">${q.q}</div>${q.o.length>2?'<button class="hint" id="hint">💡 Dica: tirar uma alternativa errada</button>':''}<div id="ops">${ord.map(x=>`<button class="opt" data-k="${x.k}">${x.t}</button>`).join('')}</div><div id="ex"></div>`);
 bindBack(()=>{if(confirm('Sair do quiz? O progresso desta rodada será perdido.'))o.wid?go.world(o.wid):go.home()});
 let done=false;
 const answer=k=>{if(done)return;done=true;clearTimers();const ok=k===q.a;S.answered++;
  app.querySelectorAll('#ops .opt').forEach(b=>{const bk=+b.dataset.k;if(bk===q.a)b.classList.add('ok');else if(bk===k)b.classList.add('bad');b.disabled=true});
  if(ok){Q.right++;Q.combo++;S.maxCombo=Math.max(S.maxCombo,Q.combo);const g=10+Math.min(Q.combo-1,5)*2;addXP(g);floatTxt(`+${g}${Q.combo>2?' 🔥':''}`);sfx('ok');vib(30);
    if(o.review){S.review=S.review.filter(x=>x!==q.id)}}
  else{Q.combo=0;Q.wrong.push(q);sfx('bad');vib([80,40,80]);if(!S.review.includes(q.id))S.review.push(q.id);if(o.lives)Q.lives--}
  save();
  const lastQ=Q.i===Q.qs.length-1||(o.lives&&Q.lives<=0);
  document.getElementById('ex').innerHTML=`<div class="exp">${k===-1?'<b class="x">⏰ Tempo esgotado!</b> ':ok?'<b class="k">'+pick(PRAISE)+'</b> ':'<b class="x">'+pick(OOPS)+'</b> '}${q.x}</div><button class="btn ${ok?'g':''}" id="nx">${lastQ?'Ver resultado':'Próxima →'}</button>`;
  document.getElementById('nx').onclick=()=>{if(lastQ)endQuiz();else{Q.i++;showQ()}}};
 on('#ops .opt',el=>answer(+el.dataset.k));
 const hb=document.getElementById('hint');if(hb)hb.onclick=()=>{const wr=[...app.querySelectorAll('#ops .opt')].filter(b=>+b.dataset.k!==q.a&&!b.disabled);if(wr.length>1){const b=pick(wr);b.disabled=true;b.style.opacity=.3;b.style.textDecoration='line-through';sfx('tap')}hb.remove()};
 if(o.time){let t=o.time,tm=document.getElementById('tm');timers.push(setInterval(()=>{t-=.2;tm.style.width=(t/o.time*100)+'%';if(t<=0)answer(-1)},200))}
}
function endQuiz(){const o=Q.opts,n=Q.qs.length,pct=Q.right/n;let msg='',st='';
 if(o.wid){const s=S.w[o.wid];const prev=s.quiz;s.quiz=Math.max(s.quiz,pct);save();
  st=pct>=.9?'⭐⭐⭐':pct>=.7?'⭐⭐☆':pct>=.4?'⭐☆☆':'☆☆☆';
  msg=pct>=.7?(prev<.7?'🔓 Próximo mundo liberado!':'Aprovado de novo!'):'Precisa de 70% para avançar. Revise a lição e tente de novo!'}
 if(o.boss){const win=Q.lives>0&&pct>=.6;if(win){S.boss++;save()}st=win?'👑🏆👑':'💀';msg=win?'VOCÊ DERROTOU O CHEFÃO! Pronto para domingo!':'O chefão venceu desta vez. Revise os erros e volte mais forte!'}
 if(o.review){if(!S.review.length){S.badges.cleaner=1;save()}msg=S.review.length?`Ainda restam ${S.review.length} para dominar.`:'Lista de erros zerada! 🎯'}
 if(pct>=.7||(o.boss&&S.boss))confetti();
 checkBadges();
 h(`<div class="result"><div class="bigst">${st||(pct>=.7?'🎉':'💪')}</div><h2>${Q.right}/${n} acertos</h2><p>${msg}</p>
 ${Q.wrong.length?`<div class="exp" style="text-align:left"><b>Para revisar:</b><br>${Q.wrong.map(q=>'• '+q.q.slice(0,90)+(q.q.length>90?'…':'')).join('<br>')}</div>`:''}
 <button class="btn g" id="ok">Continuar</button>${Q.wrong.length&&!o.review?'<button class="btn ghost" id="rv">🎯 Revisar erros agora</button>':''}</div>`);
 document.getElementById('ok').onclick=()=>o.onEnd?o.onEnd({right:Q.right,n}):go.home();
 const rv=document.getElementById('rv');if(rv)rv.onclick=go.review;
}

/* ---------- jogos ---------- */
go.game=function(id,gi){const w=W.find(x=>x.id===id),g=w.games[gi];({classify:gClassify,order:gOrder,thermo:gThermo,shower:gShower})[g.type](w,g,gi)};
function gameDone(w,gi,pass,score){const s=S.w[w.id];const prev=s.games[gi]||{pass:false,best:0};s.games[gi]={pass:prev.pass||pass,best:Math.max(prev.best,score||0)};if(pass&&!prev.pass){addXP(40);confetti();sfx('lvl')}save();checkBadges()}
function gIntro(w,g,gi,how,start){h(`${topbar('🎮 '+g.title)}<div class="lcard center"><div class="em">${w.e}</div><h3>${g.title}</h3><p>${g.sub}</p><div class="tip" style="text-align:left">${how}</div><button class="btn y" id="go">Começar!</button></div>`);bindBack(()=>go.world(w.id));document.getElementById('go').onclick=start}

function gClassify(w,g,gi){gIntro(w,g,gi,`⏱️ ${g.time} segundos para classificar ${g.items.length} cartas.<br>🔥 Acertos seguidos multiplicam os pontos.<br>✅ Acerte 80% de tudo para ganhar a estrela.`,()=>{
 const G={items:shuffle(g.items),i:0,ok:0,score:0,combo:0,t:g.time};
 const draw=()=>{const it=G.items[G.i];h(`${topbar('🎮 '+g.title)}<div class="hud" style="justify-content:space-between"><span class="pill">${G.i+1}/${G.items.length}</span><span class="pill">🏅 ${G.score}</span><span class="pill combo">🔥 x${G.combo}</span></div><div class="timer"><i id="tm" style="width:${G.t/g.time*100}%"></i></div>
  <div class="gitem"><div><small>${it[1]}</small>${it[0]}</div></div><div class="cats">${g.cats.map((c,k)=>`<button class="cat" data-k="${k}" style="background:${c[1]}">${c[0]}</button>`).join('')}</div>`);
  bindBack(()=>go.world(w.id));
  on('.cat',el=>{const k=+el.dataset.k;if(k===it[2]){G.ok++;G.combo++;const p=10*(1+Math.floor(G.combo/3));G.score+=p;floatTxt('+'+p);sfx('ok');vib(20)}else{G.combo=0;sfx('bad');vib(100);el.style.animation='shake .4s';toast(`❌ Era ${g.cats[it[2]][0]}`)}
   G.i++;if(G.i>=G.items.length)end();else setTimeout(draw,k===it[2]?80:600)});
  timers.push(setInterval(()=>{G.t-=.2;const tm=document.getElementById('tm');if(tm)tm.style.width=(G.t/g.time*100)+'%';if(G.t<=0)end()},200))};
 const end=()=>{clearTimers();const acc=G.ok/G.items.length,pass=acc>=.8;const bonus=G.i>=G.items.length?Math.round(G.t)*2:0;G.score+=bonus;addXP(Math.round(G.score/10));gameDone(w,gi,pass,G.score);
  h(`<div class="result"><div class="bigst">${pass?'⭐':'💪'}</div><h2>${G.ok}/${G.items.length} certas</h2><p>Pontos: <b>${G.score}</b>${bonus?` (bônus de tempo +${bonus})`:''}</p><p>${pass?'Estrela conquistada!':G.i<G.items.length?'O tempo acabou! Mais rápido da próxima vez.':'Precisa de 80% de acerto. Bora de novo?'}</p><button class="btn y" id="ag">Jogar de novo</button><button class="btn ghost" id="bk2">Voltar ao mundo</button></div>`);
  document.getElementById('ag').onclick=()=>gClassify(w,g,gi);document.getElementById('bk2').onclick=()=>go.world(w.id)};
 draw()})}

function gOrder(w,g,gi){gIntro(w,g,gi,`Toque nos itens na ordem correta.<br>✅ No máximo 2 erros para ganhar a estrela.`,()=>{
 let k=0,err=0;const pool=shuffle(g.items.map((t,i)=>({t,i})));
 const draw=()=>{h(`${topbar('🎮 '+g.title)}<p class="muted">${g.sub} · erros: <b>${err}</b></p><div class="ord">${g.items.slice(0,k).map((t,i)=>`<div class="done">${i+1}. ${t}</div>`).join('')}</div><hr style="border-color:#ffffff18;margin:14px 0"><div class="ord" id="pool">${pool.filter(p=>p.i>=k).map(p=>`<button data-i="${p.i}">${p.t}</button>`).join('')}</div>`);
  bindBack(()=>go.world(w.id));
  on('#pool button',el=>{if(+el.dataset.i===k){k++;sfx('ok');vib(20);if(k===g.items.length){const pass=err<=2;addXP(20);gameDone(w,gi,pass,100-err*10);
   h(`<div class="result"><div class="bigst">${pass?'⭐':'💪'}</div><h2>Ordem completa!</h2><div class="ord" style="text-align:left">${g.items.map((t,i)=>`<div class="done">${i+1}. ${t}</div>`).join('')}</div><p>${err} erro(s). ${pass?'Estrela conquistada!':'Tente com no máximo 2 erros.'}</p><button class="btn y" id="ag">Jogar de novo</button><button class="btn ghost" id="bk2">Voltar</button></div>`);
   document.getElementById('ag').onclick=()=>gOrder(w,g,gi);document.getElementById('bk2').onclick=()=>go.world(w.id)}else draw()}
  else{err++;sfx('bad');vib(100);el.style.animation='shake .4s';setTimeout(()=>el.style.animation='',400);app.querySelector('.muted b').textContent=err}})};
 draw()})}

function gThermo(w,g,gi){let tc=20;const tasks=[['Deixe o painel de Orlando em 41 °F',()=>Math.round(tc*9/5+32)===41],['Coloque o gás em 300 K',()=>tc+273===300],['Ache a temperatura igual em °C e °F',()=>tc===-40],['Chegue ao zero absoluto',()=>tc===-273]];const done=tasks.map(()=>false);
 h(`${topbar('🌡️ '+g.title)}<div class="sim"><div class="therm">${['°C','°F','K'].map((u,k)=>`<div class="center"><div class="tube"><i class="fl"></i></div><div class="read" id="r${k}"></div></div>`).join('')}</div>
  <p class="center" style="font-weight:800" id="feel"></p><input type="range" id="sl" min="-273" max="150" value="${tc}"><div class="row"><button class="btn ghost" id="m">−1</button><button class="btn ghost" id="p">+1</button></div>
  <p class="muted" style="font-size:13px">T<sub>C</sub>/5 = (T<sub>F</sub>−32)/9 · T<sub>K</sub> = T<sub>C</sub> + 273 — as três escalas sobem juntas: a relação entre elas é uma reta!</p></div>
  <div class="sim"><b class="ttl" style="font-size:18px">🎯 Missões</b><div id="tk"></div></div><div id="fimw"></div>`);
 bindBack(()=>go.world(w.id));
 const sl=document.getElementById('sl');
 const upd=()=>{const tf=tc*9/5+32,tk=tc+273,fill=(tc+273)/423*100;
  app.querySelectorAll('.fl').forEach(i=>i.style.height=fill+'%');
  document.getElementById('r0').textContent=tc+' °C';document.getElementById('r1').textContent=(Math.round(tf*10)/10)+' °F';document.getElementById('r2').textContent=tk+' K';
  document.getElementById('feel').textContent=tc<=-273?'🧊 Zero absoluto: nada vibra!':tc<0?'🥶 Congelante':tc<15?'🧣 Frio pra danar':tc<26?'😎 Confortável':tc<40?'🥵 Calorão':tc<100?'♨️ Quente demais':'💨 Água fervendo!';
  tasks.forEach((t,i)=>{if(!done[i]&&t[1]()){done[i]=true;sfx('ok');floatTxt('✅ Missão!');addXP(10);vib(40)}});
  document.getElementById('tk').innerHTML=tasks.map((t,i)=>`<div class="task"><b>${done[i]?'✅':'⬜'}</b>${t[0]}</div>`).join('');
  const fw=document.getElementById('fimw');if(done.every(Boolean)&&!fw.innerHTML){fw.innerHTML='<button class="btn g" id="fim">Concluir laboratório ⭐</button>';document.getElementById('fim').onclick=()=>{gameDone(w,gi,true,100);go.world(w.id)}}};
 sl.oninput=()=>{tc=+sl.value;upd()};
 document.getElementById('m').onclick=()=>{tc=Math.max(-273,tc-1);sl.value=tc;upd()};document.getElementById('p').onclick=()=>{tc=Math.min(150,tc+1);sl.value=tc;upd()};
 upd();}

function gShower(w,g,gi){let pos=0,U=110;const R0=4.4; // resistência inteira
 const tasks=[['Deixe a água MORNA',()=>pos===1&&U===110],['Deixe a água QUENTE',()=>pos===2&&U===110],['Ligue em 220 V na posição quente (e veja o estrago 💥)',()=>pos===2&&U===220]];const done=tasks.map(()=>false);
 const draw=()=>{const R=pos===0?Infinity:pos===1?R0:R0/2;const P=pos===0?0:U*U/R,i=pos===0?0:U/R;
  tasks.forEach((t,k)=>{if(!done[k]&&t[1]()){done[k]=true;sfx('ok');floatTxt('✅ Missão!');addXP(10)}});
  const col=pos===0?'#7fd6ff':P>8000?'#ff3d3d':pos===1?'#ffd27a':'#ff7a2f';
  h(`${topbar('🚿 '+g.title)}<div class="sim"><div class="shower">🚿<div class="drops">${'<i style="background:'+col+'"></i><i style="background:'+col+';animation-delay:.2s"></i><i style="background:'+col+';animation-delay:.4s"></i>'}</div></div>
  <p class="center read">${pos===0?'❄️ Água fria':P>8000?'💥 QUEIMOU! P = '+Math.round(P)+' W':(pos===1?'🌤️ Morna':'🔥 Quente')+' · '+Math.round(P)+' W'}</p>
  <p class="center muted">R = ${pos===0?'∞ (circuito aberto)':R.toFixed(1)+' Ω'} · i = ${i.toFixed(0)} A</p>
  <p><b>Posição da chave</b></p><div class="seg" id="ps">${['A · Fria','B · Morna','C · Quente'].map((t,k)=>`<button data-k="${k}" class="${pos===k?'on':''}">${t}</button>`).join('')}</div>
  <p><b>Tomada</b></p><div class="seg" id="us">${[110,220].map(v=>`<button data-v="${v}" class="${U===v?'on':''}">${v} V</button>`).join('')}</div>
  <div class="tip" style="margin-top:12px">Morna usa a resistência <b>inteira</b> (${R0} Ω); quente usa <b>metade</b> (${R0/2} Ω). Com U constante, <b>P = U²/R</b>: menos resistência = mais potência. A resistência <b>não muda</b> ao trocar a tomada!</div></div>
  <div class="sim"><b class="ttl" style="font-size:18px">🎯 Missões</b>${tasks.map((t,k)=>`<div class="task"><b>${done[k]?'✅':'⬜'}</b>${t[0]}</div>`).join('')}</div>
  ${done.every(Boolean)?'<button class="btn g" id="fim">Concluir simulador ⭐</button>':''}`);
  bindBack(()=>go.world(w.id));
  on('#ps button',el=>{pos=+el.dataset.k;sfx('tap');draw()});on('#us button',el=>{U=+el.dataset.v;sfx('tap');draw()});
  const f=document.getElementById('fim');if(f)f.onclick=()=>{gameDone(w,gi,true,100);go.world(w.id)}};
 draw();}

/* ---------- chefão ---------- */
go.bossIntro=function(){setNav('home');h(`${topbar('👑 Chefão Final')}<div class="lcard center"><div class="em">👑</div><h3>Simulado ENEM</h3><p>15 questões sorteadas de todos os mundos.</p><div class="tip" style="text-align:left">❤️ 3 vidas<br>⏰ 60 s por questão<br>🏆 Vença com 60% de acerto e pelo menos 1 vida</div><button class="btn y" id="go">Enfrentar o chefão!</button></div>`);bindBack(go.home);
 document.getElementById('go').onclick=()=>runQuiz(shuffle(ALLQ).slice(0,15),{title:'👑 Chefão',boss:1,lives:3,time:60,onEnd:()=>go.home()})};

/* ---------- macetes ---------- */
go.macetes=function(){setNav('macetes');h(`<div class="top"><h2>🧠 Arsenal de Macetes</h2></div><p class="muted">Toque no card para virar. Tente lembrar antes de virar!</p>
 <button class="btn ghost" id="dic" style="margin-bottom:10px">📚 Dicionário de palavras difíceis</button>
 <button class="btn y" id="sh" style="margin-bottom:14px">🔀 Embaralhar e testar a memória</button>
 <div id="fl">${MACETES.map(([a,b])=>`<div class="flip"><div class="in"><div class="fa"><small>Situação</small><b style="font-size:18px">${a}</b></div><div class="fb"><small>Macete</small><b>${b}</b></div></div></div>`).join('')}</div>`);
 document.getElementById('dic').onclick=go.dic;
 const bind=()=>app.querySelectorAll('.flip').forEach(f=>f.onclick=()=>{f.classList.toggle('on');sfx('tap')});bind();
 document.getElementById('sh').onclick=()=>{document.getElementById('fl').innerHTML=shuffle(MACETES).map(([a,b])=>`<div class="flip"><div class="in"><div class="fa"><small>Situação</small><b style="font-size:18px">${a}</b></div><div class="fb"><small>Macete</small><b>${b}</b></div></div></div>`).join('');bind()}};

go.dic=function(){setNav('macetes');h(`${topbar('📚 Dicionário')}<p class="muted">Palavras que aparecem nas lições, explicadas de um jeito simples.</p>${Object.keys(GLOSS).sort((a,b)=>a.localeCompare(b)).map(k=>`<div class="badge"><div><b style="font-size:17px">${k[0].toUpperCase()+k.slice(1)}</b><div style="margin-top:4px">${GLOSS[k]}</div></div><button class="say" data-k="${k}" style="position:static;flex:none">🔊</button></div>`).join('')}`);bindBack(go.macetes);app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>speak(b.dataset.k+'. '+GLOSS[b.dataset.k]))};
/* ---------- revisão ---------- */
go.review=function(){setNav('review');const qs=S.review.map(id=>QBYID[id]).filter(Boolean);
 if(!qs.length){h(`<div class="top"><h2>🎯 Caça aos Erros</h2></div><div class="lcard center"><div class="em">🧹</div><h3>Nada para revisar!</h3><p>Cada questão que você errar aparece aqui. Acerte de novo para tirá-la da lista. Errar e corrigir é o jeito mais rápido de aprender. 🧠</p><button class="btn" id="b">Ir para a jornada</button></div>`);document.getElementById('b').onclick=go.home;return}
 S.hadErrors=1;save();
 h(`<div class="top"><h2>🎯 Caça aos Erros</h2></div><div class="lcard"><div class="em">🎯</div><h3>${qs.length} questão(ões) para dominar</h3><p>Acertou → sai da lista. Errou → continua. Zere a lista para ganhar a conquista!</p>${[...new Set(qs.map(q=>q.w))].map(id=>{const w=W.find(x=>x.id===id);return `<span class="chip">${w.e} ${w.name}: ${qs.filter(q=>q.w===id).length}</span>`}).join('')}<button class="btn y" id="go">Caçar erros!</button></div>`);
 document.getElementById('go').onclick=()=>runQuiz(shuffle(qs),{title:'🎯 Revisão',review:1,onEnd:()=>go.review()})};

/* ---------- perfil ---------- */
go.profile=function(){setNav('profile');checkBadges();
 h(`<div class="top"><h2>🏆 Perfil</h2></div><div class="hero"><div class="big">🏆</div><h1>Nível ${level()}</h1><p><b>${title()}</b> · ${S.xp} XP</p><div class="bar"><i style="width:${(S.xp%150)/1.5}%"></i></div></div>
 <div class="hud" style="margin-bottom:14px"><span class="pill">✅ ${S.answered} respostas</span><span class="pill">🔥 maior combo ${S.maxCombo}</span><span class="pill">📅 ${S.streak.n} dia(s)</span></div>
 <h3 class="ttl" style="margin:8px 0">Conquistas</h3>${BADGES.map(([e,n,d])=>`<div class="badge ${S.badges[n]?'':'off'}"><div class="e">${e}</div><div><b>${n}</b><div class="muted" style="font-size:13px">${d}</div></div></div>`).join('')}
 <h3 class="ttl" style="margin:16px 0 8px">Configurações</h3>
 <button class="btn ghost" id="fr">${S.free?'🔒 Voltar ao modo jornada':'🔓 Modo livre (liberar todos os mundos)'}</button>
 <button class="btn ghost" id="rs" style="background:#5a1a2a">🗑️ Zerar progresso</button>`);
 document.getElementById('fr').onclick=()=>{S.free=!S.free;save();toast(S.free?'Todos os mundos liberados!':'Modo jornada ativado');go.profile()};
 document.getElementById('rs').onclick=()=>{if(confirm('Apagar todo o progresso?')){try{localStorage.removeItem(KEY)}catch(e){}load();save();go.home()}}};

go.home();checkBadges();
</script>
